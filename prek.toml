default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
language = "system"
entry = "pnpm run format:check"
files = '^(website/.*\.(css|html|js|json|jsonc|jsx|md|mdx|scss|ts|tsx|ya?ml)|package\.json|pnpm-workspace\.yaml|prek\.toml|\.github/workflows/.*\.ya?ml|\.oxfmtrc\.json|\.oxlintrc\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
language = "system"
entry = "pnpm run lint"
files = '^website/.*\.(js|jsx|ts|tsx)$'
pass_filenames = false

[[repos.hooks]]
id = "website-typecheck"
name = "website typecheck"
language = "system"
entry = "pnpm run website:typecheck"
files = '^website/(src/.*\.(ts|tsx)|vite\.config\.ts|tsconfig.*\.json|package\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = '\.rs$'
pass_filenames = false

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-useless-excludes"
