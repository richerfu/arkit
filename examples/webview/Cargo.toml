[package]
name = "webview_example"
description = "Pluginized WebView example for Arkit"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The `webview` feature enables the ohos.webview bridge plugin; the framework
# registers the plugin facade and injects its initialization automatically.
arkit = { workspace = true, features = ["webview"] }
futures-channel = "0.3"
futures-util = "0.3"
napi-ohos.workspace = true
napi-derive-ohos.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true
