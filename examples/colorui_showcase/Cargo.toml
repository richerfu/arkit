[package]
name = "colorui_showcase"
description = "Interactive showcase for Arkit ColorUI components — same demos as shadcn_showcase"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
arkit = { workspace = true, features = ["colorui", "markdown", "code", "router"] }
arkit_calendar_icu.workspace = true
dioxus.workspace = true
tokio = { workspace = true, features = ["time"] }
napi-ohos.workspace = true
napi-derive-ohos.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true
