[package]
name = "router_example"
description = "Native routing and navigation example for Arkit"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
arkit = { workspace = true, features = ["router"] }
# Required by the upstream `Routable` expansion (`dioxus::config_macros`).
dioxus.workspace = true
napi-ohos.workspace = true
napi-derive-ohos.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true
