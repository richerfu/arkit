[package]
name = "terminal_example"
description = "rio-vt embedded terminal showcase for arkit"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arkit = { workspace = true, features = ["terminal"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
# SSH host lives in the example, not in arkit_terminal.
russh.workspace = true
