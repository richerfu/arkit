[workspace]
members = [
    "crates/arkit",
    "crates/arkit_derive",
    "crates/arkit_runtime",
    "crates/arkit_arkui",
    "crates/arkit_elements",
    "crates/arkit_prelude",
    "crates/arkit_hooks",
    "crates/arkit_shadcn",
    "plugins/arkit_calendar_icu",
    "crates/arkit_router",
    "crates/arkit_i18n",
    "crates/arkit_i18n_macros",
    "crates/arkit_lottie",
    "crates/arkit_animation",
    "crates/arkit_animation_core",
    "crates/arkit_canvas",
    "crates/arkit_chart",
    "crates/arkit_camera",
    "crates/arkit_barcode",
    "crates/arkit_icon",
    "crates/arkit_terminal",
    "examples/counter",
    "examples/async_task",
    "examples/animation",
    "examples/canvas",
    "examples/chart",
    "examples/camera",
    "examples/barcode",
    "examples/complex_cases",
    "examples/i18n",
    "examples/lottie",
    "examples/plugins",
    "examples/router",
    "examples/shadcn_showcase",
    "examples/terminal",
    "examples/webview",
    "examples/demos",
]
# `app/` is an OpenHarmony application shell (ArkTS + hvigor), not a Rust crate.
exclude = ["app"]
resolver = "2"

[workspace.package]
version = "0.0.1-beta.0"
edition = "2021"
# The syntax-highlighting dependency tree-sitter-language requires Rust 1.90.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/richerfu/arkit"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "deny"
todo = "warn"

[workspace.dependencies]
# Keep the framework crates on one coordinated prerelease.
arkit = { version = "=0.0.1-beta.0", path = "crates/arkit" }
# Compile-contract alias used by the i18n example to verify that public proc
# macros resolve Cargo package renames instead of hard-coding `::arkit`.
framework = { package = "arkit", version = "=0.0.1-beta.0", path = "crates/arkit" }
arkit_animation = { version = "=0.0.1-beta.0", path = "crates/arkit_animation" }
arkit_animation_core = { version = "=0.0.1-beta.0", path = "crates/arkit_animation_core" }
arkit_canvas = { version = "=0.0.1-beta.0", path = "crates/arkit_canvas" }
arkit_chart = { version = "=0.0.1-beta.0", path = "crates/arkit_chart" }
arkit_camera = { version = "=0.0.1-beta.0", path = "crates/arkit_camera" }
arkit_barcode = { version = "=0.0.1-beta.0", path = "crates/arkit_barcode" }
arkit_terminal = { version = "=0.0.1-beta.0", path = "crates/arkit_terminal" }
arkit_derive = { version = "=0.0.1-beta.0", path = "crates/arkit_derive" }
arkit_icon = { version = "=0.0.1-beta.0", path = "crates/arkit_icon" }
arkit_i18n = { version = "=0.0.1-beta.0", path = "crates/arkit_i18n" }
arkit_i18n_macros = { version = "=0.0.1-beta.0", path = "crates/arkit_i18n_macros" }
arkit_lottie = { version = "=0.0.1-beta.0", path = "crates/arkit_lottie" }
arkit_router = { version = "=0.0.1-beta.0", path = "crates/arkit_router" }
arkit_runtime = { version = "=0.0.1-beta.0", path = "crates/arkit_runtime" }
arkit_shadcn = { version = "=0.0.1-beta.0", path = "crates/arkit_shadcn" }
arkit_calendar_icu = { version = "=0.0.1-beta.0", path = "plugins/arkit_calendar_icu" }
arkit_arkui = { version = "=0.0.1-beta.0", path = "crates/arkit_arkui" }
arkit_elements = { version = "=0.0.1-beta.0", path = "crates/arkit_elements" }
arkit_prelude = { version = "=0.0.1-beta.0", path = "crates/arkit_prelude" }
arkit_hooks = { version = "=0.0.1-beta.0", path = "crates/arkit_hooks" }
# Third-party requirements use major.minor; Cargo.lock records tested patches.
bindgen = "0.72"
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12"
pollster = "1.0"
libc = "0.2"
rust-embed = { version = "8.12", features = ["debug-embed"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }
# Build reqwest's rustls backend with an explicit WebPKI root store; OHOS does
# not expose a certificate store supported by rustls-platform-verifier.
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
russh = { version = "0.63", default-features = false, features = ["flate2", "rsa", "ring"] }
rxing = { version = "0.9", default-features = false, features = ["decoders", "encoders", "encoding_rs", "full_barcode_format_support"] }
png = "0.18"
rio-vt = { version = "0.5", default-features = false }
futures-channel = "0.3"
futures-util = "0.3"

# Dioxus 0.7 — reuse its VirtualDom, diff/reconcile, signals, hooks, and router
# directly rather than maintaining parallel framework primitives.
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
dioxus-core = "0.7"
dioxus-signals = "0.7"
dioxus-hooks = "0.7"
dioxus-core-macro = "0.7"
dioxus-router = "0.7"
dioxus-history = "0.7"
getrandom = "0.4"

syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
trybuild = "1.0"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"
napi-build-ohos = "1.2"
serde_json = "1.0"
oxc_index = "5.0"
rustc-hash = "2.1"
smallvec = "1.15"
half = { version = "2.7", default-features = false }
csscolorparser = { version = "0.8", default-features = false, features = ["named-colors"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.23"
icu_calendar = { version = "2.3", default-features = false }

# Tree-sitter syntax highlighting for Markdown fenced code (optional feature).
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"


# Keep the Rust Ability core and WebView facade on the same published prerelease.
openharmony-ability = { version = "=1.0.0-beta.3", features = ["keyboard"] }
openharmony-ability-plugin-webview = "=1.0.0-beta.3"

# Published wrappers include the key/input event APIs and lifecycle fixes.
ohos-arkui-binding = { version = "0.4", default-features = false, features = ["napi", "xcomponent", "image", "drawing", "api-23"] }
# The high-level wrapper does not expose the raw accessibility action flags.
ohos-arkui-sys = { version = "0.1", default-features = false, features = ["api-23"] }
ohos-drawing-binding = { version = "0.2", default-features = false, features = ["api-23"] }
ohos-image-native-binding = { version = "0.0", default-features = false, features = ["api-20"] }
ohos-display-binding = "0.1"
ohos-hilog-binding = "0.2"
ohos-ime-binding = { version = "0.3", default-features = false, features = ["api-22"] }
ohos-ability-access-control-binding = "0.1"
ohos-camera-binding = { version = "0.2", default-features = false, features = ["api-20", "xcomponent"] }
ohos-xcomponent-binding = { version = "0.5", default-features = false, features = ["callbacks", "multi_mode", "api-23"] }
ohos-native-window-binding = { version = "0.3", default-features = false, features = ["api-20"] }
ohos-vsync-binding = { version = "0.3", default-features = false, features = ["api-20"] }
thorvg = { version = "0.6", default-features = false, features = ["vendored", "lottie", "png", "fonts", "threads"] }
# Sharing an Animation's Picture with its canvas requires native ref/unref.
thorvg-sys = { version = "0.4", default-features = false }
wgpu = { version = "30.0", default-features = false, features = ["std", "gles", "wgsl"] }
