[workspace]
members = [
    "crates/arkit",
    "crates/arkit_derive",
    "crates/arkit_runtime",
    "crates/arkit_arkui",
    "crates/arkit_dom",
    "crates/arkit_elements",
    "crates/arkit_prelude",
    "crates/arkit_hooks",
    "crates/arkit_shadcn",
    "plugins/arkit_calendar_icu",
    "crates/arkit_router",
    "crates/arkit_i18n",
    "crates/arkit_i18n_macros",
    "crates/arkit_lottie",
    "crates/arkit_animation",
    "crates/arkit_animation_core",
    "crates/arkit_canvas",
    "crates/arkit_chart",
    "crates/arkit_camera",
    "crates/arkit_barcode",
    "crates/arkit_icon",
    "crates/arkit_terminal",
    "examples/counter",
    "examples/async_task",
    "examples/animation",
    "examples/canvas",
    "examples/chart",
    "examples/camera",
    "examples/barcode",
    "examples/complex_cases",
    "examples/i18n",
    "examples/lottie",
    "examples/plugins",
    "examples/router",
    "examples/shadcn_showcase",
    "examples/terminal",
    "examples/webview",
    "examples/demos",
]
# `app/` is an OpenHarmony application shell (ArkTS + hvigor), not a Rust crate.
exclude = ["app"]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.0"
edition = "2021"
# The resolved N-API 1.2 toolchain crates require Rust 1.88. Keep the declared
# MSRV aligned with the actual graph instead of advertising an unbuildable 1.85.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "warn"
undocumented_unsafe_blocks = "deny"
todo = "warn"

[workspace.dependencies]
arkit = { path = "crates/arkit" }
# Compile-contract alias used by the i18n example to verify that public proc
# macros resolve Cargo package renames instead of hard-coding `::arkit`.
framework = { package = "arkit", path = "crates/arkit" }
arkit_animation = { path = "crates/arkit_animation" }
arkit_animation_core = { path = "crates/arkit_animation_core" }
arkit_canvas = { path = "crates/arkit_canvas" }
arkit_chart = { path = "crates/arkit_chart" }
arkit_camera = { path = "crates/arkit_camera" }
arkit_barcode = { path = "crates/arkit_barcode" }
arkit_terminal = { path = "crates/arkit_terminal" }
arkit_derive = { path = "crates/arkit_derive" }
arkit_icon = { path = "crates/arkit_icon" }
arkit_i18n = { path = "crates/arkit_i18n" }
arkit_i18n_macros = { path = "crates/arkit_i18n_macros" }
arkit_lottie = { path = "crates/arkit_lottie" }
arkit_router = { path = "crates/arkit_router" }
arkit_runtime = { path = "crates/arkit_runtime" }
arkit_shadcn = { path = "crates/arkit_shadcn" }
arkit_calendar_icu = { path = "plugins/arkit_calendar_icu" }
arkit_arkui = { path = "crates/arkit_arkui" }
arkit_dom = { path = "crates/arkit_dom" }
arkit_elements = { path = "crates/arkit_elements" }
arkit_prelude = { path = "crates/arkit_prelude" }
arkit_hooks = { path = "crates/arkit_hooks" }
bindgen = "0.72"
bytemuck = { version = "1.23", features = ["derive"] }
glyphon = "0.12"
pollster = "0.4"
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
# Reqwest 0.12 exposes a WebPKI-root feature that avoids relying on platform
# certificate-store discovery, which is not portable to the OHOS target.
reqwest = { version = "0.12.28", default-features = false, features = ["brotli", "deflate", "gzip", "rustls-tls-webpki-roots"] }
russh = { version = "0.54", default-features = false, features = ["flate2", "rsa", "ring"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoders", "encoding_rs", "full_barcode_format_support"] }
png = "0.17"

# Dioxus 0.7 — reuse its VirtualDom, diff/reconcile, signals, hooks, and router
# directly rather than maintaining parallel framework primitives.
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
dioxus-core = "0.7"
dioxus-signals = "0.7"
dioxus-hooks = "0.7"
dioxus-core-macro = "0.7"
dioxus-router = "0.7"
getrandom = "0.2"

syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
trybuild = "1.0"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
napi-ohos = { version = "1.1", features = ["napi8"] }
napi-derive-ohos = "1.1"
napi-build-ohos = "1.1"
serde_json = "1"
oxc_index = "5.0.0"
rustc-hash = "2.1.3"
smallvec = "1.15.2"
half = { version = "2.7.1", default-features = false }
csscolorparser = { version = "0.8.3", default-features = false, features = ["named-colors"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
base64 = "0.22.1"
icu_calendar = { version = "2.2.1", default-features = false }

# Tree-sitter syntax highlighting for Markdown fenced code (optional feature).
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"


# Pluginized mainline with the normalized node surface (#70) and transparent
# native XComponent background (#73). Published on crates.io since 1.0.0-beta.0.
# Keep both packages on the same version.
openharmony-ability = "1.0.0-beta.1"
openharmony-ability-plugin-webview = "1.0.0-beta.1"

# Published on crates.io. The wrapper user_data ownership fixes previously
# pinned to fix/arkui-wrapper-lifecycle-023 are integrated upstream; declare
# `0.2` (no patch) so resolution always lands on the latest 0.2.x.
ohos-arkui-binding = { version = "0.2", default-features = false, features = ["napi", "image", "drawing", "api-20"] }
ohos-arkui-sys = { version = "0.1", default-features = false, features = ["api-20"] }
ohos-drawing-binding = { version = "0.2", default-features = false, features = ["api-20"] }
ohos-native-drawing-sys = { version = "0.2", default-features = false, features = ["api-20"] }
# 0.0.x crates have no meaningful "0.x" form (`0.0` would match any 0.0.z,
# and each 0.0.z can break); keep the exact version.
ohos-image-native-binding = { version = "0.0.5", default-features = false, features = ["api-20"] }
ohos-display-binding = "0.1"
ohos-hilog-binding = "0.2"
ohos-ime-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings", branch = "feat/terminal-native-bindings", default-features = false, features = ["api-22"] }
ohos-ability-access-control-binding = "0.1"
ohos-camera-binding = { version = "0.1", default-features = false, features = ["api-20", "xcomponent"] }
ohos-xcomponent-binding = { version = "0.3", default-features = false, features = ["callbacks", "multi_mode", "api-20"] }
ohos-xcomponent-sys = { version = "0.1", default-features = false, features = ["api-20"] }
ohos-native-window-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings", branch = "feat/terminal-native-bindings", default-features = false, features = ["api-20"] }
ohos-vsync-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings", branch = "feat/terminal-native-bindings", default-features = false, features = ["api-20"] }
thorvg = { version = "0.5.0", default-features = false, features = ["vendored", "lottie", "png", "fonts", "threads"] }
thorvg-sys = { version = "0.3.0", default-features = false }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "gles", "wgsl"] }
